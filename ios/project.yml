# XcodeGen spec — generates Echo.xcodeproj.
#   brew install xcodegen
#   cd ios && xcodegen generate && open Echo.xcodeproj
name: Echo
options:
  bundleIdPrefix: com.akira      # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"      # bump for every TestFlight upload (docs/TESTFLIGHT.md §5)
    DEVELOPMENT_TEAM: ""              # set your Apple Team ID (or pick it in Signing & Capabilities)
targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - path: Echo
    # Push notifications are OFF (free Apple account). To turn them on once you
    # have the paid Apple Developer Program: uncomment these 4 lines, set
    # ECHO_PUSH_ENABLED to YES below, then run `xcodegen generate`.
    # entitlements:
    #   path: Config/Echo.entitlements
    #   properties:
    #     aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akira.echo
        ECHO_PUSH_ENABLED: "NO"        # YES only together with the entitlements above
        PRODUCT_NAME: Echo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Echo-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ECHO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  EchoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EchoTests
    dependencies:
      - target: Echo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akira.echo.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Echo.app/Echo"
schemes:
  Echo:
    build:
      targets:
        Echo: all
        EchoTests: [test]
    test:
      targets:
        - EchoTests
